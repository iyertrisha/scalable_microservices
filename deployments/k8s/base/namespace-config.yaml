apiVersion: v1
kind: Namespace
metadata:
  name: fleetflow
---
apiVersion: v1
kind: Secret
metadata:
  name: fleetflow-secrets
  namespace: fleetflow
type: Opaque
stringData:
  postgres-password: fleetflow
  jwt-secret: fleetflow-dev-secret-change-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetflow-config
  namespace: fleetflow
data:
  KAFKA_BROKERS: "kafka.fleetflow.svc.cluster.local:9092"
  REDIS_ADDR: "redis:6379"
  ORDER_DATABASE_URL: "postgres://fleetflow:fleetflow@postgres:5432/orders?sslmode=disable"
  DRIVER_DATABASE_URL: "postgres://fleetflow:fleetflow@postgres:5432/drivers?sslmode=disable"
  PRICING_DATABASE_URL: "postgres://fleetflow:fleetflow@postgres:5432/pricing?sslmode=disable"
  DRIVER_SERVICE_URL: "http://driver-service:8081"
  ORDER_SERVICE_URL: "http://order-service:8080"
  SAFE_ASSIGN: "true"
  USE_REDIS_LOCK: "true"
  AUTH_ENABLED: "false"
