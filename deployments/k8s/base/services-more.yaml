---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleetflow
  namespace: fleetflow
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8080
          - path: /drivers
            pathType: Prefix
            backend:
              service:
                name: driver-service
                port:
                  number: 8081
          - path: /tracking
            pathType: Prefix
            backend:
              service:
                name: tracking-service
                port:
                  number: 8083
          - path: /location
            pathType: Prefix
            backend:
              service:
                name: location-service
                port:
                  number: 8084
          - path: /health
            pathType: Exact
            backend:
              service:
                name: order-service
                port:
                  number: 8080
