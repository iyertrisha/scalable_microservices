apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-service
  namespace: fleetflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracking-service
  template:
    metadata:
      labels:
        app: tracking-service
    spec:
      containers:
        - name: tracking-service
          image: fleetflow/tracking-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: fleetflow-config
          env:
            - name: TRACKING_ADDR
              value: ":8083"
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  namespace: fleetflow
spec:
  selector:
    app: tracking-service
  ports:
    - port: 8083
---
