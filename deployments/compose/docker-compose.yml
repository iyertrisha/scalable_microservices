services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetflow
      POSTGRES_PASSWORD: fleetflow
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  order-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: order-service
    profiles: ["apps"]
    ports:
      - "8080:8080"
    environment:
      ORDER_ADDR: ":8080"
      ORDER_DATABASE_URL: postgres://fleetflow:fleetflow@postgres:5432/orders?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  driver-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: driver-service
    profiles: ["apps"]
    ports:
      - "8081:8081"
    environment:
      DRIVER_ADDR: ":8081"
      DRIVER_DATABASE_URL: postgres://fleetflow:fleetflow@postgres:5432/drivers?sslmode=disable
      SAFE_ASSIGN: "true"
    depends_on:
      postgres:
        condition: service_healthy

  dispatch-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: dispatch-service
    profiles: ["apps"]
    ports:
      - "8082:8082"
    environment:
      DISPATCH_ADDR: ":8082"
      KAFKA_BROKERS: kafka:9092
      DRIVER_SERVICE_URL: http://driver-service:8081
      ORDER_SERVICE_URL: http://order-service:8080
      REDIS_ADDR: redis:6379
      USE_REDIS_LOCK: "true"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      order-service:
        condition: service_started
      driver-service:
        condition: service_started

  tracking-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: tracking-service
    profiles: ["apps"]
    ports:
      - "8083:8083"
    environment:
      TRACKING_ADDR: ":8083"
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  location-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: location-service
    profiles: ["apps"]
    ports:
      - "8084:8084"
    environment:
      LOCATION_ADDR: ":8084"
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  pricing-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: pricing-service
    profiles: ["apps"]
    ports:
      - "8085:8085"
    environment:
      PRICING_ADDR: ":8085"
      PRICING_DATABASE_URL: postgres://fleetflow:fleetflow@postgres:5432/pricing?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      DEMAND_LEVEL: normal
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        SERVICE: notification-service
    profiles: ["apps"]
    ports:
      - "8086:8086"
    environment:
      NOTIFICATION_ADDR: ":8086"
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pgdata:
