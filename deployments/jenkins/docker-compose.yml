version: '3.8'
# Optional Jenkins for local CI that mirrors the IDFC-style pipeline.
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    ports:
      - "8088:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

volumes:
  jenkins_home:
